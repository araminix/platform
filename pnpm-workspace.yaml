allowBuilds:
  bufferutil: false
  es5-ext: false
  utf-8-validate: false
minimumReleaseAgeExclude:
  - '@araminix/lib@1.0.0 || 1.3.0 || 2.1.1 || 3.1.0'
  - axios@1.21.0
overrides:
  decode-uri-component: '>=0.5.1'
